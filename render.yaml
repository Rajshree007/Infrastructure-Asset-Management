services:
  # Backend Web Service
  - type: web
    name: rbinfragov-backend
    env: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # Frontend Static Site
  - type: web
    name: rbinfragov-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://rbinfragov-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
